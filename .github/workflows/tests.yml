name: tests

on:
  push:
    branches:
      - master
  pull_request:

env:
  CI: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
            # CLI arguments
          args: --check lua/ tests/
  tests:
    strategy:
      fail-fast: false
      matrix:
        version:
          - v0.9.5
          - v0.10.0
          - v0.10.1
          - v0.10.2
          - nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        id: neovim
        with:
          neovim: true
          version: ${{ matrix.version }}
      - name: Install Org Tree-sitter parser
        run: |
          parser_source="$(mktemp -d)"
          git clone --depth 1 https://github.com/milisims/tree-sitter-org.git "$parser_source"
          mkdir -p "$HOME/.local/share/nvim/site/parser"
          cc -O2 -shared -fPIC -I "$parser_source/src" \
            "$parser_source/src/parser.c" "$parser_source/src/scanner.c" \
            -o "$HOME/.local/share/nvim/site/parser/org.so"
      - name: Run tests
        run: make test